<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Service Entry</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7fb;color:#222;font-family:Arial,sans-serif}
header{background:#295294;color:white;padding:18px 16px;text-align:center}
header h1{margin:0;font-size:22px}
header p{margin:5px 0 0;font-size:13px;opacity:.9}
main{max-width:650px;margin:auto;padding:14px}
.card{background:white;border-radius:14px;padding:16px;box-shadow:0 2px 12px #00000012;margin-bottom:14px}
label{display:block;font-weight:600;font-size:14px;margin:13px 0 6px}
input,textarea,select{width:100%;padding:12px;border:1px solid #ccd3df;border-radius:9px;font-size:16px;background:white}
textarea{min-height:80px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{border:0;border-radius:9px;padding:13px 15px;font-size:15px;font-weight:700;cursor:pointer}
.primary{width:100%;background:#295294;color:#fff;margin-top:16px}
.secondary{background:#2494CC;color:white}
.danger{background:#c62828;color:white}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.status-complete{color:#138a3d;font-weight:700}
.status-pending{color:#c62828;font-weight:700}
#msg{margin-top:12px;padding:10px;border-radius:8px;display:none}
.ok{background:#e7f7ed;color:#13783a}
.err{background:#fdeaea;color:#a51f1f}
.count{font-size:14px;color:#555}
@media(max-width:480px){.row{grid-template-columns:1fr}.actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>Service Entry</h1>
  <p>Service / Complaint Tracker</p>
</header>
<main>
<div class="card">
  <div class="count">Total entries: <strong id="count">0</strong></div>

  <form id="form">
    <div class="row">
      <div>
        <label>Inward Date *</label>
        <input id="inward_date" type="date" required>
      </div>
      <div>
        <label>Outward Date</label>
        <input id="outward_date" type="date">
      </div>
    </div>

    <label>Model No. *</label>
    <input id="model_no" placeholder="Enter model number" required>

    <label>Customer Details *</label>
    <input id="customer_details" placeholder="Name / phone / address" required>

    <label>Complaints *</label>
    <textarea id="complaints" placeholder="Customer complaint" required></textarea>

    <label>Status *</label>
    <select id="status" required>
      <option value="Complete">Complete</option>
      <option value="Pending">Pending</option>
    </select>

    <label>Remarks</label>
    <textarea id="remarks" placeholder="Service remarks"></textarea>

    <label>Item Replaced</label>
    <input id="item_replaced" placeholder="Part / item replaced">

    <label>Final Remark</label>
    <textarea id="final_remark" placeholder="Final service remark"></textarea>

    <label>Service Charge</label>
    <input id="service_charge" type="number" step="0.01" min="0" placeholder="0">

    <button class="primary" type="submit">Save Entry</button>
    <div id="msg"></div>
  </form>
</div>

<div class="card">
  <div class="actions">
    <button class="secondary" onclick="downloadExcel()">Download Latest Excel</button>
    <button class="danger" onclick="clearAll()">Clear All Data</button>
  </div>
</div>
</main>

<script>
const $ = id => document.getElementById(id);

function today(){
  const d=new Date();
  return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
}
$("inward_date").value=today();

async function refreshCount(){
  try{
    const r=await fetch("/api/count");
    const j=await r.json();
    $("count").textContent=j.count ?? 0;
  }catch(e){}
}
refreshCount();

function message(text, ok=true){
  const el=$("msg");
  el.textContent=text;
  el.className=ok?"ok":"err";
  el.style.display="block";
  setTimeout(()=>el.style.display="none",4000);
}

$("form").addEventListener("submit", async e=>{
  e.preventDefault();
  const payload={
    inward_date:$("inward_date").value,
    outward_date:$("outward_date").value,
    model_no:$("model_no").value,
    customer_details:$("customer_details").value,
    complaints:$("complaints").value,
    status:$("status").value,
    remarks:$("remarks").value,
    item_replaced:$("item_replaced").value,
    final_remark:$("final_remark").value,
    service_charge:$("service_charge").value
  };

  try{
    const r=await fetch("/api/entries",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(payload)
    });
    const j=await r.json();
    if(!r.ok) throw new Error(j.error || "Could not save entry");

    message("Entry saved successfully.");
    $("form").reset();
    $("inward_date").value=today();
    $("status").value="Complete";
    refreshCount();
  }catch(err){message(err.message,false)}
});

function downloadExcel(){
  window.location.href="/api/download";
}

async function clearAll(){
  if(!confirm("Delete ALL service entries? This cannot be undone.")) return;
  try{
    const r=await fetch("/api/clear",{method:"POST"});
    const j=await r.json();
    if(!r.ok) throw new Error(j.error || "Could not clear data");
    message("All service data cleared.");
    refreshCount();
  }catch(err){message(err.message,false)}
}
</script>
</body>
</html>
